<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <!-- Only this app's own files may load. No internet, no inline scripts. -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Habibi Thinks</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="card">
      <img class="logo" src="logo.svg" alt="" />
      <h1>Habibi Thinks</h1>
      <p class="tagline">Yallah, let Claude think like a habibi.</p>
      <p class="tagline-ar" lang="ar" dir="rtl">يلّا، خلّ كلود يفكّر على طريقة حبيبي</p>

      <div class="divider"></div>

      <div class="switch-row">
        <label class="switch">
          <input type="checkbox" id="toggle" aria-label="Habibi Thinks" />
          <span class="slider"></span>
        </label>
        <span id="state"></span>
      </div>

      <div id="message"></div>

      <button class="link-button" id="install-extension">Install Browser Extension</button>
    </main>

    <script src="renderer.js"></script>
  </body>
</html>
