<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Habibi Thinks</title>
    <style>
      body { font-family: sans-serif; padding: 20px; }
      h1 { margin-top: 0; }
      .status div { margin-bottom: 4px; }
      textarea { width: 100%; height: 160px; font-family: monospace; box-sizing: border-box; }
      button { padding: 8px 16px; margin-top: 8px; margin-right: 8px; }
      #resync-result { margin-top: 8px; font-size: 14px; }
    </style>
  </head>
  <body>
    <h1>Habibi Thinks</h1>

    <div class="status">
      <div>Claude Code (CLI + VS Code): <span id="status-claude-code">checking...</span></div>
      <div>Claude Desktop: <span id="status-desktop">not supported yet</span></div>
    </div>

    <h3>Your words</h3>
    <p>One word per line.</p>
    <textarea id="verbs"></textarea>
    <br />
    <button id="save">Save</button>
    <button id="resync">Resync</button>
    <button id="install-extension">Install Browser Extension</button>
    <div id="resync-result"></div>

    <script src="renderer.js"></script>
  </body>
</html>
