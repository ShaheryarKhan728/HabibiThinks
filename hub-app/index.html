<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Habibi Thinks</title>
    <style>
      body { font-family: sans-serif; padding: 20px; }
      h1 { margin-top: 0; }
      .status div { margin-bottom: 4px; }
      button { padding: 8px 16px; margin-top: 8px; margin-right: 8px; }
      #result { margin-top: 12px; font-size: 14px; white-space: pre-line; }
    </style>
  </head>
  <body>
    <h1>Habibi Thinks</h1>

    <div class="status">
      <div>Claude Code (terminal): <span id="status-claude-code">checking...</span></div>
      <div>Claude Code (VS Code): <span id="status-vscode">checking...</span></div>
      <div>Claude Desktop: <span>not supported (the app is locked)</span></div>
    </div>

    <button id="turn-on">Turn on Habibi Thinks</button>
    <button id="turn-off">Turn off</button>
    <br />
    <button id="install-extension">Install Browser Extension</button>
    <div id="result"></div>

    <script src="renderer.js"></script>
  </body>
</html>
